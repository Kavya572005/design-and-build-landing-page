<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <div id="heading"></div>
    <script>
        let rows = parseInt(prompt('Enter the row number:'));
        let cols = parseInt(prompt('Enter the column number:'));

        if (isNaN(rows) || isNaN(cols) || rows <= 0 || cols <= 0) {
            alert('Enter a valid number');
        } else {
            let table = "<table border='1' cellpadding='10' style='margin:auto; text-align:center; border-collapse:collapse;'>";

            for (let i = 0; i < rows; i++) {
                table += '<tr>';
                for (let j = 0; j < cols; j++) {
                    let color = (i + j) % 2 == 0 ? "white" : "black";
                    table += "<td style='background-color:" + color + "; width:30px; height:30px;'></td>";
                }
                table += '</tr>';
            }
            table += "</table>";
            document.getElementById('heading').innerHTML = table;
        }
    </script>
</body>
</html>
