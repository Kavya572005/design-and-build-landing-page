<!DOCTYPE html>
<html>
    <head>
        <title>membership form</title>
    </head>
    <body>
        <h2><center>Membership Registration Form</center></h2>
        <p>Please fill out the form to register as a member</p>
        <form action="URL_HERE" method="post">
            <label for="fullname">Full Name:</label><br>
            <input type="text" name="fullname" required><br><br>
            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob"><br><br>
            <label for="gender">Gender:</label><br>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="feMale">
            <label for="male">Female</label><br>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">other</label><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>
            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phonw" name="phone"><br><br>
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="3" cols="30"></textarea><br><br>
            <label for="profilepic">Profile Picture Upload:</label><br>
            <input type="file" id="profilepic" name="profilepic" accept="image/*"><br><br>
            <label for="membershiptype">Membership Type:</label><br>
            <select id="membershiptype" name="membershiptype" required><br>
                <option value>--SELECT--</option>
                <option value="basics">Basics</option>
                <option value="premium">Premium</option>
                <option value="vip">VIP</option>
            </select><br><br> 
            <fieldset>
                <lengend><b>Area of Interest:</b></lengend><br><br>
                <label for="network"></label>
                <input type="checkbox" name="network" value="Network">Network<br><br>
                <label for="events"></label>
                <input type="checkbox" name="events" value="Events">Events<br><br>
                <label for="training"></label>
                <input type="checkbox" name="training" value="Training">Training<br><br>
                <label for="volunteering"></label>
                <input type="checkbox" name="volunteering" value="Volunteering">Volunteering<br><br>
            </fieldset><br>  
            <input type="checkbox" id="conset" name="conset">
            <label for="conset">I agree to the terms and conditions and privacy policy.</label><br><br>
            <input type="submit" value="Register now" style="background-color: rgb(27, 27, 217); color:white">
            <p><a href="index3.html">click here to go back</a></p>
        </form>
    </body>
</html>
