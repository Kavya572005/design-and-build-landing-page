<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let units = parseFloat(prompt('Enter the number of electricity units consumed:'));
        if (isNaN(units) || units < 0) {
            alert("Please enter a valid number.");
        } 
        else {
            let bill = 0;
            if (units <= 100) {
                bill = 0;
            } 
            else if (units <= 200) {
                bill = (100 * 2) + (units - 100) * 2;
            } 
            else if (units <= 300) {
                bill = (100 * 2) + (100 * 3) + (units - 200) * 3;
            } 
            else if (units <= 400) {
                bill = (100 * 2) + (100 * 3) + (100 * 4) + (units - 300) * 4;
            }
            else if (units <= 500) {
                bill = (100 * 2) + (100 * 3) + (100 * 4) +(100 * 5) + (units - 400) * 5; 
            }
            else {
                bill = (100 * 2) + (100 * 3) + (100 * 4) + (100 * 5) + (units - 500) * 10;
            }
            alert("Your Electricity Bill is: ₹" + bill.toFixed(2));
        }
    </script>
</body>
</html>
